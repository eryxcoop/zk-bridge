[package]
name = "zk-circuit-operator"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zk_circuit_operator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.37", features = ["derive"] }
hex = "0.4.3"
mithril-client = { version = "0.12.2", default-features = false, features = [
    "fs",
    "num-integer-backend",
    "rustls-tls",
    "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.12.7", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-webpki-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tx_set_update_circuit = { package = "tx-set-update-circuit", path = "../circuit_inclusion_exclusion" }
mithril_snapshot_circuit = { package = "mithril-circuits-utils", path = "../circuit_transaction_snapshot" }
