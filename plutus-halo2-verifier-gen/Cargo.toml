[package]
name = "plutus-halo2-verifier-gen"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
halo2_proofs = { git = "https://github.com/input-output-hk/halo2", rev = "0bca06e58937fbe213a0530ecac9d8e0fed501d6" }
atms-halo2 = { git = "https://github.com/input-output-hk/sidechains-zk/", rev = "8828ea3f86cfc113f9bc33fb4801dfea2654f05d", package = "atms-halo2" }
halo2curves = { version = "0.7.0" }
blstrs = { git = "https://github.com/davidnevadoc/blstrs", rev = "3dfe5bf" }
mithril-stm = { git = "https://github.com/input-output-hk/mithril.git", rev = "c0641158f7807e298b1815576502047f8fdf8d93", package = "mithril-stm", features = ["future_snark"] }
midnight-circuits = "=6.0.0"
midnight-curves = "=0.2.0"
midnight-proofs = "=0.7.0"
midnight-zk-stdlib = "=1.0.0"

ff = "0.13.0"
digest = "0.10.7"
ciborium = "0.2.2"
serde_json = "1.0.113"
blake2b_simd = "1.0.2"
handlebars = "6.1.0"
itertools = "0.14.0"
hex = "0.4.3"
log = "0.4.22"
env_logger = "0.11.5"
rand_core = { package = "rand_core", version = "0.6.4" }
serde = { version = "1.0.219", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3.1"
anyhow = "1.0.100"
group = "0.13.0"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
sha2 = "0.10.9"
thiserror = "2.0.18"

[features]
plutus_debug = ["halo2_proofs/plutus_debug"]
