[package]
name = "bridge_build_canonical_locking_tx"
version = "0.1.0"
edition = "2021"

# Canonical minimal locking-transaction builder.
#
# Single source of truth for the bridge's canonical locking transaction body:
# 1 input, 1 output (index 0, native bridge asset + inline LockingTxDatum), a
# fee, and nothing else. Produces the canonical Conway tx-body CBOR and its
# blake2b-256 hash (the canonical Cardano transaction id). The on-chain Aiken
# validator reconstructs the same body byte-for-byte; a cross-check test asserts
# the two hashes are identical.
[dependencies]
hex = "0.4.3"
pallas = { version = "1.0.0-alpha.6", features = ["hardano", "phase2", "unstable"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.122"
