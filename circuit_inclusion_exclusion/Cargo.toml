[package]
name = "tx-set-update-circuit"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "tx_set_update.rs"

[[bin]]
name = "arkworks_circom_fixture_export"
path = "bin/arkworks_circom_fixture_export.rs"

[[bin]]
name = "generate_test_witness_for_circuit"
path = "bin/generate_test_witness_for_circuit.rs"

[dependencies]
anyhow = "1.0.102"
ark-bls12-381 = "0.5.0"
ark-circom = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
circom-prover = "0.1.4"
hex = "0.4.3"
num-bigint = "0.4.6"
rust-witness = "0.1.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
rust-witness = "0.1.6"

[profile.release]
opt-level = 3

[patch.crates-io]
ark-circom = { path = "../zk-circuits-common/ark-circom" }

[workspace]
